<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resumen de tu viaje</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/resumen-viaje.css}">
</head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="resumen-viaje">

    <div class="titulo-resumen">
        <div>
            <span class="etiqueta-resumen">TU AVENTURA</span>
            <h2>Resumen de tu viaje</h2>
        </div>
        <span class="icono-viaje">✈</span>
    </div>

    <!-- ORIGEN Y DESTINOS -->
    <section class="bloque-resumen recorrido">

        <div class="titulo-bloque">
            <span class="icono-bloque">📍</span>
            <h3>Tu recorrido</h3>
        </div>

        <div class="linea-recorrido">

            <div class="parada-recorrido origen-recorrido"
                 th:if="${planificacion.origen != null}">
                <span class="marcador-recorrido"></span>
                <div class="datos-parada">
                    <span class="tipo-parada">PUNTO DE PARTIDA</span>
                    <strong th:text="${planificacion.origen}"></strong>
                </div>
                <span class="etiqueta-parada">Origen</span>
            </div>

            <div class="parada-recorrido"
                 th:each="destino, iterStat : ${planificacion.destinos}">
                <span class="marcador-recorrido marcador-destino"></span>

                <div class="datos-parada">
                    <span class="tipo-parada"
                          th:text="'DESTINO ' + (iterStat.index + 1)"></span>

                    <strong th:text="${destino.nombre}"></strong>

                    <div class="detalles-parada">
                        <span>
                            <span>📅</span>
                            <span th:text="${destino.fechaInicio}"></span>
                        </span>
                        <span>
                            <span>🌙</span>
                            <span th:text="${destino.duracion} + ' días'"></span>
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- VUELOS -->
    <section class="bloque-resumen vuelos-resumen"
             th:if="${!#lists.isEmpty(planificacion.vuelosSeleccionados)}">

        <div class="titulo-bloque">
            <span class="icono-bloque">✈️</span>
            <h3>Tus vuelos</h3>
        </div>

        <div class="lista-vuelos">

            <article class="tarjeta-vuelo"
                     th:each="vuelo : ${planificacion.vuelosSeleccionados}">

                <div class="vuelo-aerolinea">
                    <span class="icono-avion">✈</span>
                    <strong th:text="${vuelo.aerolinea}"></strong>
                </div>

                <div class="ruta-vuelo">

                    <div class="dato-aeropuerto">
                        <strong th:text="${vuelo.salida}"></strong>
                        <span th:text="${vuelo.aeropuertoOrigen}"></span>
                    </div>

                    <div class="conector-vuelo">
                        <span class="linea-vuelo"></span>
                        <span class="avion-ruta">✈</span>
                        <small>Vuelo</small>
                    </div>

                    <div class="dato-aeropuerto destino-aeropuerto">
                        <strong th:text="${vuelo.llegada}"></strong>
                        <span th:text="${vuelo.aeropuertoDestino}"></span>
                    </div>

                </div>

                <div class="precio-vuelo"
                     th:text="${vuelo.precio != null ? 'USD ' + vuelo.precio : 'Precio a consultar'}">
                </div>

            </article>

        </div>
    </section>

    <!-- VIAJEROS Y PREFERENCIAS -->
    <section class="bloque-resumen detalles-viaje">

        <div class="titulo-bloque">
            <span class="icono-bloque">⚙️</span>
            <h3>Detalles de tu viaje</h3>
        </div>

        <div class="detalles-columnas">

            <div class="detalle-grupo">
                <h4>👥 Viajeros</h4>

                <div class="dato-viajero">
                    <span>Adultos</span>
                    <strong th:text="${planificacion.adultos}"></strong>
                </div>

                <div class="dato-viajero">
                    <span>Niños</span>
                    <strong th:text="${planificacion.ninos}"></strong>
                </div>
            </div>

            <div class="detalle-grupo">
                <h4>🏨 Preferencias</h4>

                <div class="dato-alojamiento">
                    <span>Alojamiento</span>
                    <strong th:text="${planificacion.alojamiento}"></strong>
                </div>

                <div class="intereses-resumen">
                    <span class="subtitulo-intereses">Intereses</span>

                    <div class="etiquetas-intereses">
                        <span class="etiqueta-interes"
                              th:each="interes : ${planificacion.intereses}"
                              th:text="${interes}">
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ACCIONES -->
    <div class="acciones-resumen">

        <a th:href="@{/seleccion-vuelo}" class="enlace-secundario">
            Cambiar vuelos
        </a>

        <a th:href="@{/planificacion}" class="enlace-secundario">
            Volver a planificar
        </a>

        <a th:href="@{/itinerario}" class="boton boton-itinerario">
            Elegir hotel y actividades →
        </a>

    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
