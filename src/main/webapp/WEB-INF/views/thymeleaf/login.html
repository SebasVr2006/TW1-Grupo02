<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-login">
    <form class="login-form"
          id="login-form"
          th:action="@{/login}"
          th:object="${datosLogin}"
          method="post">

        <p th:if="${mensajeError != null}"
           th:text="${mensajeError}"
           class="mensaje-error"
           role="alert"></p>

        <label for="email">E-Mail</label>
        <input id="email"
               type="email"
               th:field="*{email}"
               placeholder="E-Mail"
               required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena"
               type="password"
               th:field="*{password}"
               placeholder="Contraseña"
               required>

        <div class="botones">
            <button class="boton" type="submit">Aceptar</button>
            <button class="boton" type="reset">Cancelar</button>
        </div>
    </form>

    <div class="registro-container">
        <p>¿No tienes una cuenta? <a th:href="@{/registro}">Registrate.</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
