<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-login">
    <form class="login-form" id="login-form">

        <label for="E-Mail">E-Mail</label>
        <input id="E-Mail" type="email" name="E-Mail" placeholder="E-Mail">

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" name="contrasena" placeholder="Contraseña">

        <div class="botones">
            <button class="boton" type="submit">Aceptar</button>
            <button class="boton" type="reset">Cancelar</button>
        </div>
    </form>

    <div class="registro-container">
        <p>¿No tienes una cuenta? <a th:href="@{/registro}">Registrate.</a></p>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
