<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planificar viaje</title>

    <!-- PARA SPRING / LOCALHOST -->

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/planificacion.css}">


    <!-- PARA ABRIR DIRECTAMENTE DESDE VS CODE -->
    <!--
    <link rel="stylesheet" href="../../../resources/core/css/main.css">
    <link rel="stylesheet" href="../../../resources/core/css/planificacion.css">
    -->

</head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main>

    <h2>Planificá tu viaje</h2>
    <p class="error-formulario" role="alert" th:if="${error}" th:text="${error}"></p>
    
    <form th:action="@{/planificacion}" method="post" id="formPlanificacion">
        <section class="destinos">

            <h3>Destinos</h3>

            <div class="destino">
                <h4>Destino 1</h4>

                <label for="destino-0">Destino:</label>
                <input type="text" id="destino-0" name="destinos[0].nombre" required>

                <label for="fechaInicio-0">Fecha de inicio:</label>
                <input type="date" id="fechaInicio-0" name="destinos[0].fechaInicio" required>

                <label for="duracion-0">Duración:</label>
                <input type="number" id="duracion-0" name="destinos[0].duracion" min="1" required>

                <span>días</span>
            </div>

            <button type="button" id="agregarDestino">
                + Agregar destino
            </button>

        </section>


        <section class="viajeros">

            <h3>Cantidad de viajeros</h3>

            <label for="adultos">Adultos:</label>
            <input type="number" id="adultos" name="adultos"
                   min="1" value="1" required>

            <label for="ninos">Niños:</label>
            <input type="number" id="ninos" name="ninos"
                   min="0" value="0" required>

        </section>


        <section class="preferencias">

            <h3>Preferencias</h3>

            <label for="alojamiento">Tipo de alojamiento:</label>

            <select id="alojamiento" name="alojamiento" required>
                <option value="">Seleccionar</option>
                <option value="hotel">Hotel</option>
                <option value="departamento">Departamento</option>
                <option value="hostel">Hostel</option>
            </select>


            <p>Intereses:</p>

            <label>
                <input type="checkbox" name="intereses" value="playa">
                Playa
            </label>

            <label>
                <input type="checkbox" name="intereses" value="cultura">
                Cultura
            </label>

            <label>
                <input type="checkbox" name="intereses" value="gastronomia">
                Gastronomía
            </label>

            <label>
                <input type="checkbox" name="intereses" value="naturaleza">
                Naturaleza
            </label>

        </section>


        <button type="submit" class="boton" id="continuar">
            Continuar
        </button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- PARA SPRING / LOCALHOST -->

<script type="module" th:src="@{/js/planificacion.js}"></script>


<!-- PARA ABRIR DIRECTAMENTE DESDE VS CODE -->
<!--
<script src="../../../resources/core/js/planificacion.js"></script>
-->

</body>
</html>
